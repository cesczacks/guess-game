[project]
name = "guess-game"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Qinhong Wang", email = "Qinhong.Wang@dyson.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "langchain>=1.4.3",
    "langchain-aws>=1.8.1",
    "langgraph>=1.2.14",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
guess-game = "guess_game.cli:main"
guess-game-api = "fastapi_cli.cli:main"

[tool.fastapi]
entrypoint = "guess_game.api.app:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
